listen_addr: ":8080"

server:
  read_timeout: 30
  write_timeout: 30

backends:
  - url: "http://localhost:9001"
    weight: 1
  - url: "http://localhost:9002"
    weight: 1

jwt:
  secret: "your-secret-key"
  issuer: "go-api-gateway"
  allowed_algorithms:
    - "HS256"

rate_limit:
  rps: 100
  burst: 200

circuit_breaker:
  threshold: 5
  timeout: 30

metrics:
  enabled: true
  path: "/metrics"
